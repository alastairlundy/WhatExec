# Dependabot configuration.
# Version updates run weekly (Mondays) with a 14-day cooldown so fast-moving
# packages (TUnit, Polyfill, Meziantou.Analyzer, GitHub Actions) don't open a
# PR per release. Cooldowns only apply to version updates; Dependabot security
# updates are unaffected and still open immediately.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14

  - package-ecosystem: "github-actions"
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14